<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>家里的今天</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14233f">
<meta name="apple-mobile-web-app-title" content="家里的今天">
<style>
:root{--bg:#f4efe4;--card:#fffdf8;--ink:#1c2740;--mute:#77808f;--line:#e6dcc6;--gold:#b8862c;--gold2:#d9ac4e;--navy:#14233f;--navy2:#0b1730;--good:#2f6b4f;--care:#a5621a;--plain:#5d6b85;--blue:#3566c9;--purple:#7d52bd;--pink:#cf5c88}
@media (prefers-color-scheme:dark){:root{--bg:#0b1326;--card:#131f3a;--ink:#ece6d6;--mute:#98a3b8;--line:#263556;--gold:#d9ac4e;--gold2:#f0d28a;--good:#7fc4a0;--care:#e6b566;--plain:#a9b6cf;--blue:#7ea6f5;--purple:#b596ea;--pink:#f092b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#f3e7c8;padding:30px 18px 54px;border-bottom:1px solid var(--gold)}
.top .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:14px}
.top img{width:46px;height:46px;border-radius:12px;box-shadow:0 0 0 1px rgba(217,172,78,.55)}
.top h1{font:600 25px/1.2 "Songti SC","Noto Serif SC",serif;margin:0;letter-spacing:.12em;color:#f0d28a}
.top p{margin:4px 0 0;font-size:13px;color:#b9c3d8;letter-spacing:.04em}
main{max-width:620px;margin:-34px auto 0;padding:0 16px 56px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;margin-top:16px;box-shadow:0 6px 22px rgba(20,35,63,.07)}
h2{display:flex;align-items:center;gap:10px;font:600 13px/1 "Songti SC","Noto Serif SC",serif;letter-spacing:.24em;color:var(--gold);margin:0 0 14px}
h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold2),transparent)}
.day{font:600 21px/1.4 "Songti SC","Noto Serif SC",serif;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.gz{color:var(--mute);font-size:14px;letter-spacing:.06em}
.chip{font:600 12.5px/1 -apple-system,"PingFang SC",sans-serif;padding:5px 11px;border-radius:99px;border:1.5px solid currentColor;letter-spacing:.08em}
.v-good{color:var(--good)}.v-care{color:var(--care)}.v-plain{color:var(--plain)}
.sum{margin:10px 0 14px;font-size:16.5px}
.who{display:grid;grid-template-columns:4.6em 1fr;gap:4px 10px;padding:11px 0;border-top:1px solid var(--line)}
.who b{font-weight:600;display:flex;align-items:center;gap:7px;align-self:start;line-height:1.7}
.who b:before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.c-blue{color:var(--blue)}.c-purple{color:var(--purple)}.c-pink{color:var(--pink)}.c-def{color:var(--gold)}
.who div{color:var(--ink)}
.act{margin-top:14px;padding:12px 14px;border:1px solid var(--gold2);background:linear-gradient(180deg,rgba(217,172,78,.13),rgba(217,172,78,.04));border-radius:12px}
.act span,.rem span{font-size:12.5px;color:var(--gold);letter-spacing:.14em;display:block;margin-bottom:2px}
.rem{margin-top:12px;font-size:15px}
.news ul{list-style:none;padding:0;margin:0}
.news li{padding:12px 0;border-top:1px solid var(--line)}.news li:first-child{border-top:0;padding-top:0}
.news a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--gold2);text-decoration-thickness:1.5px;text-underline-offset:4px}
.news small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px;letter-spacing:.03em}
.wk h3{font:600 15px/1.4 "Songti SC","Noto Serif SC",serif;margin:16px 0 6px;color:var(--ink)}.wk h3:first-of-type{margin-top:0}
.wk ul{margin:0;padding-left:1.1em}.wk li{margin:0 0 8px}.wk li::marker{color:var(--gold2)}
details{border-top:1px solid var(--line);padding:11px 0}details:first-of-type{border-top:0;padding-top:0}
summary{cursor:pointer;font-weight:600}summary small{font-weight:400;color:var(--mute);margin-left:8px}
summary::marker{color:var(--gold2)}
details .inner{padding:10px 0 2px;font-size:15px}
footer{margin-top:24px;color:var(--mute);font-size:12px;text-align:center;line-height:1.8}
.empty{color:var(--mute)}
</style>
</head>
<body>
<div class="top"><div class="in"><img src="/icon.svg" alt=""><div><h1>家里的今天</h1><p id="upd">正在读取…</p></div></div></div>
<main>
<div id="app"></div>
<footer>八字黄历只做参考，具体的事看实际情况。新闻只列事实和来源，不是投资建议。</footer>
</main>
<script>
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";
const vcls=v=>/有利/.test(v)?"v-good":/留意/.test(v)?"v-care":"v-plain";
const WHO={"蓝蓝":"c-blue","紫紫":"c-purple","粉粉":"c-pink"};
const md=d=>{const p=(d||"").split("-");return p.length===3?(+p[1])+"月"+(+p[2])+"日":d};
function tipHtml(d){
  let h=`<div class="day"><span>${esc(md(d.date))} ${esc(d.weekday||"")}</span><span class="chip ${vcls(d.verdict||"")}">${esc(d.verdict||"平常")}</span></div>`;
  if(d.ganzhi)h+=`<div class="gz">${esc(d.ganzhi)}</div>`;
  if(d.summary)h+=`<p class="sum">${esc(d.summary)}</p>`;
  for(const p of d.people||[])h+=`<div class="who"><b class="${WHO[p.who]||"c-def"}">${esc(p.who)}</b><div>${esc(p.text)}</div></div>`;
  if(d.action)h+=`<div class="act"><span>今日一件事</span>${esc(d.action)}</div>`;
  if(d.remind)h+=`<div class="rem"><span>提醒</span>${esc(d.remind)}</div>`;
  return h;
}
function newsHtml(d){
  if(!(d.news||[]).length)return "";
  return `<ul>`+d.news.map(n=>`<li><a href="${esc(safeUrl(n.u))}" target="_blank" rel="noopener">${esc(n.t)}</a><small>${esc([n.about,n.src,n.date].filter(Boolean).join(" · "))}</small>${n.zh?`<div>${esc(n.zh)}</div>`:""}</li>`).join("")+`</ul>`;
}
function weekHtml(w){
  const blk=(t,a)=>(a&&a.length)?`<h3>${t}</h3><ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
  return blk("持仓这一周",w.holdings)+blk("书里的提醒",w.books)+blk("上周对照",w.review)+blk("下周展望",w.outlook);
}
function render(data){
  const days=(data.days||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  const weekly=(data.weekly||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  document.getElementById("upd").textContent=data.updated?("更新于 "+data.updated):"还没有内容";
  let h="";
  if(!days.length){h+=`<section><p class="empty">还没有内容。每天早上会自动更新。</p></section>`}
  else{
    const t=days[0];
    h+=`<section><h2>今日提示</h2>${tipHtml(t)}</section>`;
    const n=newsHtml(t);
    if(n)h+=`<section class="news"><h2>今天可以读</h2>${n}</section>`;
  }
  if(weekly.length)h+=`<section class="wk"><h2>本周小结 · ${esc(md(weekly[0].date))}</h2>${weekHtml(weekly[0])}</section>`;
  const old=days.slice(1,31);
  if(old.length||weekly.length>1){
    h+=`<section><h2>往期</h2>`;
    for(const d of old)h+=`<details><summary>${esc(md(d.date))} ${esc(d.weekday||"")}<small>${esc(d.verdict||"")}</small></summary><div class="inner">${tipHtml(d)}<div class="news" style="margin-top:12px">${newsHtml(d)}</div></div></details>`;
    for(const w of weekly.slice(1,9))h+=`<details><summary>周小结 ${esc(md(w.date))}</summary><div class="inner wk">${weekHtml(w)}</div></details>`;
    h+=`</section>`;
  }
  document.getElementById("app").innerHTML=h;
}
fetch("/api/data",{credentials:"same-origin"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(render)
 .catch(e=>{document.getElementById("upd").textContent="读取失败（"+e.message+"）";});
</script>
</body>
</html>
